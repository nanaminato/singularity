<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇点 · 项目工作台</title>
<link rel="stylesheet" href="/editor.css">
<script src="/tree.js" defer></script>
<script src="/universe.js" defer></script>
<script src="/editor.js" defer></script>
</head>
<body>
<header><div><span>奇点 / 项目工作台</span><h1 id="project">项目模型</h1></div><button id="reload">重新加载</button></header>
<p id="status" role="status"></p>
<main>
<aside>
<label>管理对象<select id="collection"><option value="nodes">节点</option><option value="relations">关系</option><option value="references">文件引用</option><option value="views">树视图</option></select></label>
<label id="tree-control">节点浏览方式<select id="tree"></select></label>
<label>搜索<input id="search" type="search" placeholder="名称或 ID"></label>
<button id="create">新建</button>

<ul id="items"></ul>
</aside>
<div id="universe-panel">
<div class="universe-tools" role="toolbar" aria-label="画布工具栏">
<button id="fit-universe" title="缩放至全部节点可见">适应画布</button>
<div class="zoom-tools"><button id="zoom-out" aria-label="缩小画布">−</button><output id="zoom-level" aria-label="当前缩放">100%</output><button id="zoom-in" aria-label="放大画布">+</button></div>
<span class="canvas-hint">滚轮缩放 · 拖动平移</span>
<details id="relation-menu">
<summary>附加关系 <span id="relation-count">0</span><span aria-hidden="true">⌄</span></summary>
<div class="relation-popover">
<div class="relation-heading"><strong>显示附加关系</strong><button id="hide-relations">清空</button></div>
<p>父子关系始终显示</p>
<div id="relation-options"></div>
</div>
</details>
<select id="visible-relations" multiple hidden aria-label="附加关系"></select>
</div><canvas id="universe" aria-label="层级森林画布"></canvas></div>
<section id="inspector">
<nav id="forest-navigation" aria-label="父子节点导航"></nav><h2 id="heading">请选择对象</h2>
<form id="editor" hidden>
<div id="fields"></div>
<div class="actions"><button type="submit">保存</button><button type="button" id="remove">删除</button></div>
<div id="delete-confirmation" hidden>
<p id="delete-message"></p>
<button type="button" id="delete-accept">确认删除</button>
<button type="button" id="delete-cancel">取消</button>
</div>
</form>
<details id="context" hidden>
<summary>上下文查询</summary>
<form id="query">
<label>遍历深度<input id="depth" type="number" min="0" max="100" value="2" required></label>
<label for="edge-filter">沿哪些关系遍历</label><select id="edge-filter" multiple size="5"></select>
<label for="node-filter">显示哪些节点类型</label><select id="node-filter" multiple size="5"></select>
<p>未选择时包含全部。节点类型只筛选结果，中间节点仍可用于遍历。</p>
<button>查询</button>
</form>
<div id="results"></div>
</details>
</section>
</main>
</body></html>
